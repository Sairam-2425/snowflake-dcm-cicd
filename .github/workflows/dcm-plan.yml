
name: DCM Deploy DEV and QA

on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.24"

      - name: Configure Snowflake connection
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/connections.toml << EOF
          [default]
          account = "${SNOWFLAKE_ACCOUNT}"
          user = "DCM_DEPLOY_USER"
          authenticator = "WORKLOAD_IDENTITY"
          role = "DCM_DEPLOY_ROLE"
          warehouse = "DCM_WH"
          EOF
          chmod 0600 ~/.snowflake/connections.toml

      - name: Test Snowflake connection
        run: snow connection test -c default

      - name: Plan DEV
        run: snow dcm plan --target DEV -c default

      - name: Deploy DEV
        run: snow dcm deploy --target DEV -c default

  deploy-qa:
    runs-on: ubuntu-latest
    needs: deploy-dev

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.24"

      - name: Configure Snowflake connection
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/connections.toml << EOF
          [default]
          account = "${SNOWFLAKE_ACCOUNT}"
          user = "DCM_DEPLOY_USER"
          authenticator = "WORKLOAD_IDENTITY"
          role = "DCM_DEPLOY_ROLE"
          warehouse = "DCM_WH"
          EOF
          chmod 0600 ~/.snowflake/connections.toml

      - name: Test Snowflake connection
        run: snow connection test -c default

      - name: Plan QA
        run: snow dcm plan --target QA -c default

      - name: Deploy QA
        run: snow dcm deploy --target QA -c default
